name: 'HAOS App Converter'
version: 1.3.3
slug: haos_app_converter
description: 'Web-Converter zum Konvertieren von Docker-Images in Home Assistant Apps.'
arch:
  - amd64
  - aarch64
startup: application
boot: auto
url: 'https://github.com/axute/haos-app-converter'
backup: hot
timeout: 20
watchdog: 'http://[HOST]:[PORT:80]/'
environment:
  HAOS_CONVERTER_BASHIO_VERSION: 0.17.5
  HAOS_CONVERTER_PM: apt
  CONVERTER_DATA_DIR: /addons
ingress: true
ingress_port: 80
ingress_stream: false
ingress_entry: /
panel_icon: 'mdi:toy-brick'
panel_admin: true
panel_title: 'App Converter'
map:
  - type: addons
    read_only: false
